name: publish

# Runs the full pipeline on the pinned Eurostat file, keeps the outputs as a
# build artifact and publishes the HTML report to GitHub Pages.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rmarkdown, any::knitr, any::scales
      - name: Run pipeline
        run: Rscript scripts/run_pipeline.R
      - name: Render report
        run: Rscript scripts/render_report.R
      - name: Keep outputs for review
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdc-outputs
          path: |
            output/*.csv
            output/run_info.json
            site/index.html
      - name: Package report for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    # GitHub Pages needs a public repository on the free plan; skip while private.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
